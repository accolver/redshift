<svg xmlns="http://www.w3.org/2000/svg" width="168" height="64" viewBox="0 0 168 64">
  <title>Redshift</title>
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff007c"/>
      <stop offset="100%" style="stop-color:#f7768e"/>
    </linearGradient>
  </defs>
  <!-- White background -->
  <rect width="168" height="64" fill="#ffffff" rx="8"/>
  <!-- Icon scaled and positioned -->
  <g transform="translate(10, 8) scale(0.375)">
    <!-- Back chevron (shifted/offset) -->
    <path
      d="M20 24 L56 64 L20 104 L36 104 L72 64 L36 24 Z"
      fill="url(#redGradient)"
      opacity="0.4"
    />
    <!-- Front chevron -->
    <path
      d="M48 24 L84 64 L48 104 L64 104 L100 64 L64 24 Z"
      fill="url(#redGradient)"
    />
  </g>
  <!-- Redshift text in dark color -->
  <text x="56" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#1a1b25">Redshift</text>
</svg>
