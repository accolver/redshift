name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
      - name: Install nak for relay E2E tests
        run: |
          go install github.com/fiatjaf/nak@v0.19.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          cd relay/nosflare && bun install --frozen-lockfile
      - name: Typecheck all product surfaces
        run: |
          bun run typecheck
          bun run typecheck:web
          cd relay/nosflare && bun run typecheck
      - name: Run scoped product lint and format checks
        run: |
          bunx biome lint cli/src packages web/src web/tests relay/nosflare/src relay/nosflare/tests --diagnostic-level=error
          bunx biome format cli/src packages web/src web/tests relay/nosflare/src relay/nosflare/tests
      - name: Build compiled CLI test subject
        run: |
          bun run verify:embeds
          bun run build:web
          bun run build:embeds
          cp cli/src/lib/embedded-files.ts /tmp/embedded-files.ts
          bun run build:embeds
          cmp /tmp/embedded-files.ts cli/src/lib/embedded-files.ts
          bun run build:cli
          ./dist/redshift --version
      - name: Run unit and integration tests
        env:
          CI: 'true'
        run: |
          bun run test:all
          cd relay/nosflare && bun test && bun run verify:generated
      - name: Run release-critical compiled lifecycle tests explicitly
        working-directory: cli
        env:
          CI: 'true'
        run: >-
          bun test tests/integration/binary-cli.test.ts
          tests/integration/upgrade-binary-e2e.test.ts
          tests/integration/installer-integrity.test.ts
          tests/integration/nak-bunker-e2e.test.ts
      - name: Run browser release gates
        run: |
          cd web
          bunx playwright install --with-deps chromium
          bun run test:e2e

  build-binaries:
    name: Build ${{ matrix.asset }}
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: redshift-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: redshift-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: redshift-darwin-x64
          - runner: macos-14
            target: bun-darwin-arm64
            asset: redshift-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build embedded dashboard
        run: |
          bun run verify:embeds
          bun run build:web
          bun run build:embeds
          cp cli/src/lib/embedded-files.ts /tmp/embedded-files.ts
          bun run build:embeds
          cmp /tmp/embedded-files.ts cli/src/lib/embedded-files.ts
      - name: Compile native binary
        run: bun build cli/src/main.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}
      - name: Smoke test native binary
        run: |
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} --help
          if ./dist/${{ matrix.asset }} --definitely-unknown; then
            echo 'Unknown command unexpectedly succeeded' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Attest and Publish Release
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: redshift-*
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - name: Generate checksums
        run: cd dist && sha256sum redshift-* sbom.spdx.json > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/redshift-linux-x64 \
            dist/redshift-linux-arm64 \
            dist/redshift-darwin-x64 \
            dist/redshift-darwin-arm64 \
            dist/checksums.txt \
            dist/sbom.spdx.json \
            --repo "${{ github.repository }}"
