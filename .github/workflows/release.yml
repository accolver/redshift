name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
      - name: Install nak for relay E2E tests
        run: |
          go install github.com/fiatjaf/nak@v0.19.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          cd relay/nosflare && bun install --frozen-lockfile
      - name: Audit frozen dependency graphs
        run: bun run audit:dependencies
      - name: Typecheck all product surfaces
        run: |
          bun run typecheck
          bun run typecheck:web
          cd relay/nosflare && bun run typecheck
      - name: Run scoped product lint and format checks
        run: |
          bunx biome lint cli/src packages tests/helpers web/src web/tests relay/nosflare/src relay/nosflare/tests --diagnostic-level=error
          bunx biome format cli/src packages tests/helpers web/src web/tests relay/nosflare/src relay/nosflare/tests
      - name: Build compiled CLI test subject
        run: |
          bun run verify:embeds
          bun run build:web
          bun run build:embeds
          cp cli/src/lib/embedded-files.ts /tmp/embedded-files.ts
          bun run build:embeds
          cmp /tmp/embedded-files.ts cli/src/lib/embedded-files.ts
          bun run build:cli
          ./dist/redshift --version
      - name: Run unit and integration tests
        env:
          CI: 'true'
        run: |
          bun run test:all
          cd relay/nosflare && bun test && bun run verify:generated
      - name: Run release-critical compiled lifecycle tests explicitly
        working-directory: cli
        env:
          CI: 'true'
        run: >-
          bun test tests/integration/binary-cli.test.ts
          tests/integration/upgrade-binary-e2e.test.ts
          tests/integration/installer-integrity.test.ts
          tests/integration/nak-bunker-e2e.test.ts
          tests/integration/relay-publication-recovery.test.ts
          tests/integration/encrypted-backup-restore.test.ts
          tests/integration/authenticated-secret-history.test.ts
      - name: Run browser release gates
        run: |
          cd web
          bunx playwright install --with-deps chromium
          bun run test:e2e
          if pgrep -f "$GITHUB_WORKSPACE/node_modules/.bun/@cloudflare.*workerd" >/dev/null; then
            echo "Browser gates leaked a repository workerd process" >&2
            exit 1
          fi

  build-binaries:
    name: Build ${{ matrix.asset }}
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: redshift-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: redshift-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: redshift-darwin-x64
          - runner: macos-14
            target: bun-darwin-arm64
            asset: redshift-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build embedded dashboard
        run: |
          bun run verify:embeds
          bun run build:web
          bun run build:embeds
          cp cli/src/lib/embedded-files.ts /tmp/embedded-files.ts
          bun run build:embeds
          cmp /tmp/embedded-files.ts cli/src/lib/embedded-files.ts
      - name: Compile native binary
        run: bun build cli/src/main.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset }}
      - name: Smoke test native binary
        run: |
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} --help
          if ./dist/${{ matrix.asset }} --definitely-unknown; then
            echo 'Unknown command unexpectedly succeeded' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Attest and Publish Release
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: redshift-*
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - name: Generate checksums
        run: cd dist && sha256sum redshift-* sbom.spdx.json > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Verify staged release attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_DIGEST=${{ github.sha }}
          for artifact in dist/redshift-* dist/checksums.txt dist/sbom.spdx.json; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --source-digest "$SOURCE_DIGEST" \
              --deny-self-hosted-runners
          done
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/redshift-linux-x64 \
            dist/redshift-linux-arm64 \
            dist/redshift-darwin-x64 \
            dist/redshift-darwin-arm64 \
            dist/checksums.txt \
            dist/sbom.spdx.json \
            --repo "${{ github.repository }}"
      - name: Publish the verified draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest

  verify-published-release:
    name: Verify Published Release (${{ matrix.platform }})
    needs: [release-please, publish-release]
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify fresh Linux installation from the public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash scripts/test-release-containers.sh
          "${{ needs.release-please.outputs.tag_name }}"
          "${{ matrix.platform }}"

  verify-published-macos:
    name: Verify Published Release (${{ matrix.platform }})
    needs: [release-please, publish-release]
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin/x64
          - runner: macos-14
            platform: darwin/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
      - name: Install pinned local relay tool
        run: |
          go install github.com/fiatjaf/nak@v0.19.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify fresh macOS installation from the public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          sh tests/release/container-entrypoint.sh
          "${{ needs.release-please.outputs.tag_name }}"

  recover-failed-release:
    name: Withdraw Failed Release
    needs:
      - release-please
      - verify-release
      - build-binaries
      - publish-release
      - verify-published-release
      - verify-published-macos
    if: >-
      ${{ always() && needs.release-please.outputs.release_created == 'true' &&
          (needs.verify-release.result == 'failure' ||
           needs.build-binaries.result == 'failure' ||
           needs.publish-release.result == 'failure' ||
           needs.verify-published-release.result == 'failure' ||
           needs.verify-published-macos.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prevent a failed release from remaining latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          IS_DRAFT=$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
          if [ "$IS_DRAFT" = "false" ]; then
            gh release edit "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --latest=false \
              --prerelease
          fi
          echo "Release $TAG_NAME failed certification and must be fixed by a new patch release." >> "$GITHUB_STEP_SUMMARY"
