name: Deploy Managed Relay

on:
  push:
    branches: [main]
    paths:
      - 'relay/nosflare/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and Deploy Relay
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: relay/nosflare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify tests and generated deployment source
        run: |
          bun run typecheck
          bun run test
          bun run verify:generated
      - name: Deploy declared worker and custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
      - name: Smoke test NIP-11 metadata
        working-directory: .
        run: |
          curl --fail --silent --show-error \
            -H 'Accept: application/nostr+json' \
            https://relay.redshiftapp.com/ | grep -q 'Redshift Managed Relay'
      - name: Smoke test WebSocket subscription
        working-directory: .
        run: |
          bun -e '
            const socket = new WebSocket("wss://relay.redshiftapp.com");
            const timer = setTimeout(() => { console.error("relay smoke timeout"); process.exit(1); }, 10000);
            socket.addEventListener("message", (message) => {
              const frame = JSON.parse(String(message.data));
              if (frame[0] === "AUTH" && typeof frame[1] === "string" && frame[1].length > 0) {
                clearTimeout(timer); socket.close(); process.exit(0);
              }
              console.error("expected NIP-42 AUTH challenge", frame); process.exit(1);
            });
            socket.addEventListener("error", () => process.exit(1));
          '
