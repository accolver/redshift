name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Product Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
      - name: Install nak for relay E2E tests
        run: |
          go install github.com/fiatjaf/nak@v0.19.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/nak" --version
      - name: Install locked product dependencies
        run: bun install --frozen-lockfile
      - name: Install locked relay dependencies
        working-directory: relay/nosflare
        run: bun install --frozen-lockfile
      - name: Typecheck product surfaces
        run: |
          bun run typecheck
          bun run typecheck:web
          cd relay/nosflare && bun run typecheck
      - name: Run scoped product lint
        run: >-
          bunx biome lint cli/src packages web/src web/tests
          relay/nosflare/src relay/nosflare/tests
          --diagnostic-level=error
      - name: Build dashboard and compiled CLI test subject
        run: |
          bun run build:web
          bun run build:embeds
          git diff --exit-code -- cli/src/lib/embedded-files.ts
          bun run build:cli
          ./dist/redshift --version
      - name: Run crypto, CLI, and web tests
        env:
          CI: 'true'
        run: bun run test:all
      - name: Run managed relay tests
        working-directory: relay/nosflare
        run: bun test
      - name: Verify generated relay deployment source
        working-directory: relay/nosflare
        run: bun run verify:generated
      - name: Install browser test runtime
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Run standalone and embedded dashboard E2E tests
        working-directory: web
        env:
          CI: 'true'
        run: bun run test:e2e

  build:
    name: Build Artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build web and CLI
        run: |
          bun run build:web
          bun run build:embeds
          git diff --exit-code -- cli/src/lib/embedded-files.ts
          bun build cli/src/main.ts --compile --target=bun-linux-x64 --outfile dist/redshift-linux-x64
          ./dist/redshift-linux-x64 --version
      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
      - name: Upload compiled CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redshift-linux-x64-ci
          path: dist/redshift-linux-x64
          retention-days: 1
