name: Verify Published Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to certify
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  resolve-release:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    outputs:
      source_digest: ${{ steps.resolve.outputs.source_digest }}
    steps:
      - name: Resolve tag source digest
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected an exact vX.Y.Z release tag" >&2
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null
          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")
          test "$(jq -r .tag_name <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r .draft <<<"$RELEASE_JSON")" = "false"
          SOURCE_DIGEST=$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)
          test -n "$SOURCE_DIGEST"
          echo "source_digest=$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"

  verify:
    name: Fresh install ${{ matrix.platform }}
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Bind checkout to resolved GitHub source digest
        run: test "$(git rev-parse HEAD)" = "${{ needs.resolve-release.outputs.source_digest }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify public installer, lifecycle, and forced upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash scripts/test-release-containers.sh
          "${{ inputs.tag }}"
          "${{ matrix.platform }}"

  verify-macos:
    name: Fresh install ${{ matrix.platform }}
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin/x64
          - runner: macos-14
            platform: darwin/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Bind checkout to resolved GitHub source digest
        run: test "$(git rev-parse HEAD)" = "${{ needs.resolve-release.outputs.source_digest }}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
      - name: Install pinned local relay tool
        run: |
          go install github.com/fiatjaf/nak@v0.19.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify public installer, lifecycle, and forced upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh tests/release/container-entrypoint.sh "${{ inputs.tag }}"
