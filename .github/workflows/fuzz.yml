name: Extended Fuzz Testing

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Base 32-bit fuzz seed (decimal or hexadecimal)
        required: false
        type: string
      runs:
        description: Cases per property (1-100000)
        required: false
        default: 5000
        type: number

permissions:
  contents: read

concurrency:
  group: extended-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Replayable Extended Fuzz Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependency graphs
        run: |
          bun install --frozen-lockfile
          cd relay/nosflare
          bun install --frozen-lockfile
      - name: Audit frozen dependency graphs
        run: bun run audit:dependencies
      - name: Run extended deterministic fuzz suite
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
          REQUESTED_RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          seed="${REQUESTED_SEED:-$GITHUB_RUN_NUMBER}"
          runs="${REQUESTED_RUNS:-5000}"
          if [[ ! "$seed" =~ ^-?[0-9]+$ && ! "$seed" =~ ^0[xX][0-9a-fA-F]+$ ]]; then
            echo "Invalid fuzz seed" >&2
            exit 1
          fi
          if [[ ! "$runs" =~ ^[0-9]+$ ]]; then
            echo "Invalid fuzz run count" >&2
            exit 1
          fi
          REDSHIFT_FUZZ_SEED="$seed" \
            REDSHIFT_FUZZ_RUNS="$runs" \
            REDSHIFT_FUZZ_TIME_MS=120000 \
            bun -e "import { fuzzParameters } from './tests/helpers/fuzz'; fuzzParameters('workflow input validation');"
          {
            echo "REDSHIFT_FUZZ_SEED=$seed"
            echo "REDSHIFT_FUZZ_RUNS=$runs"
            echo "REDSHIFT_FUZZ_TIME_MS=120000"
          } | tee fuzz-replay.txt
          {
            echo "### Extended fuzz replay"
            echo '```text'
            cat fuzz-replay.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          REDSHIFT_FUZZ_SEED="$seed" \
            REDSHIFT_FUZZ_RUNS="$runs" \
            REDSHIFT_FUZZ_TIME_MS=120000 \
            bun run test:fuzz 2>&1 | tee fuzz-output.log
      - name: Upload replay metadata and output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz-replay.txt
            fuzz-output.log
          if-no-files-found: warn
          retention-days: 14
